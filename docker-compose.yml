
version: "3.9"


# servicio par a la aplicacion
services:
  app:
    container_name: app
    image: corto1-java:1.0
    build: .
    ports:
      - 8080:8080
    depends_on:
      - java_db



      # servicio para la base de datos
  java_db:
    container_name: java_db
    image: postgres:latest
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres